<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offer Links</title>
    <script data-goatcounter="https://someguyref.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        :root {
            --bg-1: #f8f4ec;
            --bg-2: #e8efe1;
            --ink: #182026;
            --muted: #4b5a66;
            --card: #ffffffcc;
            --line: #cfd8cd;
            --accent: #0b6e4f;
            --accent-2: #126782;
            --link-hover: #b54708;
            --easy: #1f7a1f;
            --moderate: #8a5a00;
            --shadow: 0 10px 30px rgba(24, 32, 38, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 8%, #fff6dd 0%, transparent 30%),
                radial-gradient(circle at 90% 15%, #d8f0ff 0%, transparent 30%),
                linear-gradient(150deg, var(--bg-1), var(--bg-2));
            background-color: var(--bg-2);
            background-repeat: no-repeat;
            font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
            line-height: 1.45;
        }

        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 16px 40px;
        }

        .page-end-space {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 0;
            overflow: hidden;
            text-align: center;
            color: var(--muted);
            opacity: 0.25;
            font-family: "Segoe UI", Tahoma, sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .page-end-space[hidden] {
            display: none;
        }

        .hero {
            padding: 0;
            margin-bottom: 6px;
            animation: rise-in 400ms ease-out;
        }

        .hero-image-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 0;
        }

        .hero-image {
            width: min(280px, 72vw);
            height: auto;
            border-radius: 16px;
            border: 15px solid #ffffff;
            display: block;
        }

        .section {
            margin-top: 24px;
            scroll-margin-top: calc(var(--section-nav-height, 90px) + 10px);
            animation: rise-in 420ms ease-out;
        }

        .offer {
            scroll-margin-top: calc(var(--section-nav-height, 90px) + 10px);
        }

        .site-portal {
            scroll-margin-top: calc(var(--section-nav-height, 90px) - 5px);
        }

        .site-portal .offer {
            scroll-margin-top: calc(var(--section-nav-height, 90px) - 13px);
        }

        .scroll-timeline {
            --timeline-space: max(14px, calc((100vw - 980px) / 2 - 18px));
            position: fixed;
            z-index: 20;
            right: 6px;
            top: calc(var(--section-nav-height, 90px) + 8px);
            bottom: 8px;
            width: var(--timeline-space);
            display: flex;
            flex-direction: column;
            color: var(--accent-2);
            pointer-events: none;
        }

        .scroll-timeline-tick {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            align-self: flex-end;
            flex: 1;
            min-height: 0;
            width: max-content;
            max-width: 100%;
            min-width: 14px;
            padding-right: 14px;
            text-decoration: none;
            color: inherit;
        }

        .scroll-timeline-full-hover .scroll-timeline-tick {
            pointer-events: none;
        }

        .scroll-timeline-full-hover .scroll-timeline-label {
            pointer-events: none;
        }

        .scroll-timeline-full-hover .scroll-timeline-tick::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            width: min(var(--timeline-space), calc(var(--timeline-trigger-width, 14px) + 100px));
            pointer-events: auto;
        }

        .scroll-timeline-full-hover .scroll-timeline-label {
            align-self: stretch;
        }

        .scroll-timeline:not(.scroll-timeline-full-hover) .scroll-timeline-tick {
            pointer-events: none;
        }

        .scroll-timeline-tick::before {
            content: "";
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 1px;
            background: currentColor;
            opacity: 0.24;
            pointer-events: auto;
        }

        .scroll-timeline-section::before {
            content: none;
        }

        .scroll-timeline-section {
            padding-right: 0;
        }

        .scroll-timeline-section .scroll-timeline-label {
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .scroll-timeline-section .scroll-timeline-description {
            max-width: none;
            opacity: 1;
        }

        .scroll-timeline-tick:hover::before,
        .scroll-timeline-tick:focus-visible::before {
            opacity: 1;
        }

        .scroll-timeline-tick[aria-current="location"]::before {
            height: 2px;
            opacity: 0.9;
        }

        .scroll-timeline-tick[aria-current="location"] .scroll-timeline-label {
            opacity: 0.9;
        }

        .scroll-timeline-tick:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 2px;
        }

        .scroll-timeline-label {
            display: flex;
            min-width: 0;
            align-items: center;
            white-space: nowrap;
            color: inherit;
            font-size: 0.8rem;
            pointer-events: auto;
            opacity: 0.4;
        }

        .scroll-timeline-tick:hover .scroll-timeline-label,
        .scroll-timeline-tick:focus-visible .scroll-timeline-label {
            opacity: 1;
        }

        .scroll-timeline-description {
            min-width: 0;
            max-width: 0;
            overflow: hidden;
            opacity: 0;
        }

        .scroll-timeline-description>span {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .scroll-timeline-amount {
            flex-shrink: 0;
        }

        .scroll-timeline-tick:hover .scroll-timeline-description,
        .scroll-timeline-tick:focus-visible .scroll-timeline-description {
            max-width: 320px;
            opacity: 1;
        }

        .scroll-timeline-amount+.scroll-timeline-description>span {
            padding-left: 6px;
        }

        .scroll-timeline-hover-amount {
            display: none;
        }

        .scroll-timeline-compact .scroll-timeline-amount {
            display: none;
        }

        .scroll-timeline-compact .scroll-timeline-hover-amount {
            display: inline;
        }

        .scroll-timeline-compact .scroll-timeline-section {
            flex: 0 0 var(--timeline-section-height);
        }

        .scroll-timeline-compact .scroll-timeline-amount+.scroll-timeline-description>span {
            padding-left: 0;
        }

        .scroll-timeline-too-short {
            display: none;
        }

        .section-nav-sentinel {
            height: 1px;
            margin-bottom: -1px;
        }

        .section-nav {
            position: sticky;
            top: 0;
            z-index: 10;
            isolation: isolate;
            margin: 6px 0 0;
            padding: 6px 0;
        }

        .section-nav::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 50%;
            width: 100vw;
            transform: translateX(-50%);
            z-index: -1;
            background: var(--bg-2);
            box-shadow: var(--shadow);
            opacity: 0;
        }

        .section-nav.is-stuck::before,
        .section-nav.is-stuck .section-nav-image {
            opacity: 1;
        }

        .section-nav-content {
            position: relative;
            width: max-content;
            max-width: 100%;
            margin: 0 auto;
        }

        .section-nav-image {
            position: absolute;
            right: calc(100% + 12px);
            top: 0;
            height: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border: 3px solid #ffffff;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
        }

        .section-nav+.section {
            margin-top: 4px;
        }

        .section-nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 20px;
        }

        .section-nav-link {
            display: inline-flex;
            align-items: center;
            padding: 4px 0;
            color: var(--muted);
            font-size: 0.92rem;
            text-underline-offset: 3px;
        }

        .section-nav-link:focus-visible {
            outline: 3px solid var(--accent-2);
            outline-offset: 2px;
        }

        .section-contact {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 2rem;
            gap: 8px;
            margin-top: 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .section-contact-icon {
            color: var(--accent-2);
            font-size: 1.3rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .section-contact>a {
            transform: translateY(-3px);
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .section-contact-reveal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border: 0;
            padding: 0;
            background: none;
            cursor: pointer;
        }

        .section-contact-reveal:focus-visible {
            outline: 3px solid var(--accent-2);
            outline-offset: 2px;
        }

        .section h2 {
            margin: 0;
            font-size: clamp(1.35rem, 3.7vw, 1.8rem);
        }

        .section-disclosure>summary {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
            border-bottom: 3px solid #a8c7b5;
            padding-bottom: 6px;
            cursor: pointer;
            list-style: none;
        }

        .section-disclosure>summary::-webkit-details-marker {
            display: none;
        }

        .section-disclosure>summary::before {
            content: "";
            color: var(--accent-2);
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            margin: 0 4px;
            border-right: 4px solid currentColor;
            border-bottom: 4px solid currentColor;
            transform: rotate(-45deg);
        }

        .section-disclosure>summary[aria-expanded="true"]::before {
            transform: translateY(-4px) rotate(45deg);
        }

        .section-disclosure>summary:focus-visible {
            outline: 3px solid var(--accent-2);
            outline-offset: 4px;
        }

        .site-grid {
            display: grid;
            gap: 12px;
        }

        .site {
            --site-padding: 14px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: var(--site-padding);
        }

        .site-highlight,
        .offer.offer-highlight {
            border-color: #e58b50;
            box-shadow: var(--shadow), 0 0 8px #f2c1a8;
        }

        @media (prefers-reduced-motion: no-preference) {

            html {
                scroll-behavior: smooth;
            }

            .scroll-timeline-tick::before,
            .scroll-timeline-label {
                transition: opacity 150ms ease;
            }

            .scroll-timeline-description {
                transition: max-width 240ms ease, opacity 180ms ease;
            }

            .section-nav::before,
            .section-nav-image {
                transition: opacity 200ms ease;
            }

            .section-disclosure>summary::before {
                transition: transform 240ms ease;
            }

            .site-highlight,
            .offer.offer-highlight {
                animation: offer-glow 3s ease-in-out infinite;
            }
        }

        @keyframes offer-glow {

            0%,
            100% {
                box-shadow: var(--shadow), 0 0 5px #f2c1a8;
            }

            50% {
                box-shadow: var(--shadow), 0 0 18px #e58b50;
            }
        }

        .site-title {
            margin: calc(0px - var(--site-padding)) calc(0px - var(--site-padding)) 12px;
            font-size: 1.24rem;
            font-weight: 800;
            color: #0f4f65;
            background: #e7f2f8;
            border-bottom: 1px solid #c6dde8;
            border-radius: 13px 13px 0 0;
            padding: 10px var(--site-padding);
        }

        .site-title a {
            display: block;
            color: inherit;
        }

        .site>.site-title:only-child {
            margin-bottom: calc(0px - var(--site-padding));
            border-bottom: 0;
            border-radius: 13px;
        }

        .portal-offers {
            margin-left: 12px;
            padding-left: 12px;
        }

        .offers {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 10px;
        }

        .offer {
            border-top: 1px dashed #d9e1d7;
            padding-top: 10px;
        }

        .offer:first-child {
            border-top: none;
            padding-top: 0;
        }

        .offer.offer-highlight {
            border: 1px solid #e58b50;
            border-radius: 14px;
            padding: 10px;
        }

        .offer-topline {
            font-size: 1rem;
        }

        .offer-links-trigger {
            padding: 0;
            border: 0;
            background: none;
            color: #0a4d72;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .offer-links-trigger:hover,
        .offer-links-trigger:focus-visible {
            color: var(--link-hover);
        }

        .offer-links-trigger:focus-visible {
            outline: 2px solid var(--accent-2);
            outline-offset: 2px;
        }

        .amount {
            font-weight: 800;
            color: var(--accent);
            margin-right: 6px;
        }

        .name {
            font-weight: 700;
        }

        .requirement {
            margin-top: 2px;
            color: var(--muted);
            font-size: 0.96rem;
        }

        .description {
            color: var(--muted);
            font-size: 0.92rem;
            font-style: italic;
        }

        .instructions-list {
            margin: 4px 0 0;
            padding-left: 20px;
            color: var(--muted);
            font-size: 0.96rem;
        }

        .instructions-sublist {
            margin: 4px 0 4px;
            padding-left: 18px;
            list-style: disc;
        }

        details.offer-block {
            margin-top: 6px;
            border: 1px solid #ecd7a8;
            border-radius: 8px;
            background: #fdf7e8;
            padding: 6px 10px;
        }

        details.offer-block>summary {
            cursor: pointer;
            font-weight: 700;
            color: #8a5a00;
        }

        details.offer-block[open]>summary {
            margin-bottom: 4px;
        }

        .links {
            margin-top: 6px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .links-label {
            font-size: 0.87rem;
            font-weight: 700;
            color: var(--muted);
            margin-right: 2px;
        }

        .chip {
            display: inline-block;
            border: 1px solid #b6d2c3;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.87rem;
            text-decoration: none;
            color: #154f3a;
            background: #f3fbf6;
        }

        .tag {
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            vertical-align: middle;
        }

        .tag.easy {
            background: #e8f8e8;
            color: var(--easy);
            border: 1px solid #bde6bd;
        }

        .tag.moderate {
            background: #fff6e5;
            color: var(--moderate);
            border: 1px solid #efd7a4;
        }

        .tag.churnable {
            background: #fff0e8;
            color: #a43d14;
            border: 1px solid #f2c1a8;
        }

        .note {
            margin: 6px 0 0;
            font-size: 0.9rem;
            color: var(--muted);
            font-style: italic;
        }

        .reveal-email {
            background: none;
            border: 1px dashed #0a4d72;
            border-radius: 4px;
            padding: 1px 6px;
            color: #0a4d72;
            cursor: pointer;
            font-size: inherit;
            font-family: inherit;
            font-style: inherit;
        }

        .reveal-email:hover {
            color: var(--link-hover);
            border-color: currentColor;
        }

        .message {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            background: #fff;
            color: var(--muted);
        }

        a {
            color: #0a4d72;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        a:not(.scroll-timeline-tick):hover,
        a:not(.scroll-timeline-tick):focus-visible {
            color: var(--link-hover);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        a.offer-link,
        a.offer-link:hover,
        a.offer-link:focus-visible {
            text-decoration: none;
        }

        .offer-link .amount,
        .offer-link .name {
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        .section-contact-reveal:hover .section-contact-icon,
        .section-contact-reveal:focus-visible .section-contact-icon {
            color: var(--link-hover);
        }

        a:not(.scroll-timeline-tick):focus-visible {
            outline: 2px solid var(--accent-2);
            outline-offset: 2px;
        }

        @keyframes rise-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1349.98px) {
            .scroll-timeline {
                display: none;
            }
        }

        @media (max-width: 620px) {
            .section-nav-image {
                display: none;
            }

            .site {
                --site-padding: 12px;
            }

            .portal-offers {
                margin-left: 8px;
                padding-left: 8px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="hero">
            <div class="hero-image-wrap" id="hero-image-wrap">
                <img class="hero-image" src="snufking.jpg" alt="Snufking"
                    onerror="document.getElementById('hero-image-wrap').style.display='none'">
            </div>
        </section>
        <div id="content" class="message">Loading offers...</div>
    </main>

    <script>
        // Offers may define offerId and be reused with { offerRef: "offer-id" } in another section.
        // Set timelineFullRowHover: false at the JSON root to limit hover to ticks and text.
        // Offer flags hideTimelineAmount and hideTimelineHoverLabel independently hide static amounts and hover labels.
        // Sections are open by default; set "collapsed": true on a section to start it closed.
        // Section titles are defined once in JSON; showInNavigation includes that title in the top navigation.
        // JSON shape: { emails?, sections: [ { title, sites: [ { name?, url?, note?, offers?[] } ] } ] }
        // Offer collapsibles use a "blocks" array; each block picks a "preset" (label + colors) and may override label/color.
        let emailsMap = {};
        const sectionAnimations = new WeakMap();

        // Named block presets: label and colors defined once, referenced by "preset".
        const BLOCK_PRESETS = {
            instructions: {
                label: "Instructions",
                textColor: "#154f3a",
                bgColor: "#f5faf7",
                borderColor: "#cfe0d6",
                ordered: true
            },
            instructions2: {
                label: "Instructions",
                textColor: "#126782",
                bgColor: "#eef7fb",
                borderColor: "#c6dde8",
                ordered: true
            },
            notes: {
                label: "Important Notes",
                textColor: "#8a5a00",
                bgColor: "#fdf7e8",
                borderColor: "#ecd7a8",
                ordered: false
            }
        };

        function getEmbeddedData() {
            const node = document.getElementById("offers-data");
            if (!node) {
                return null;
            }
            try {
                return JSON.parse(node.textContent);
            } catch (error) {
                return null;
            }
        }

        function createEmailReveal(encoded, iconOnly) {
            const button = createElement("button", iconOnly ? "section-contact-reveal" : "reveal-email");
            button.type = "button";
            let icon;
            if (iconOnly) {
                button.setAttribute("aria-label", "Show email address");
                icon = createElement("span", "section-contact-icon", "\u2709");
                icon.setAttribute("aria-hidden", "true");
                button.appendChild(icon);
            } else {
                button.textContent = "show email";
            }
            button.addEventListener("click", function () {
                const email = atob(encoded);
                const link = createElement("a", null, email);
                link.href = "mailto:" + email;
                if (icon) {
                    button.replaceWith(icon, link);
                } else {
                    button.replaceWith(link);
                }
                link.focus();
            });
            return button;
        }

        function linkifyText(text) {
            const fragment = document.createDocumentFragment();
            const pattern = /(\*\*[^*]+\*\*|__[^_]+__|\[[^\]]+\]\(https?:\/\/[^\s)]+\)|https?:\/\/[^\s]+|\[email(?::[\w-]+)?\]|\n)/g;
            let lastIndex = 0;
            let match;
            while ((match = pattern.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
                }
                const matched = match[0];
                if (matched.startsWith("**")) {
                    const strong = createElement("strong");
                    strong.textContent = matched.slice(2, -2);
                    fragment.appendChild(strong);
                } else if (matched.startsWith("__")) {
                    const underline = createElement("u");
                    underline.textContent = matched.slice(2, -2);
                    fragment.appendChild(underline);
                } else if (matched === "\n") {
                    fragment.appendChild(createElement("br"));
                } else if (matched.startsWith("[") && matched.indexOf("](") !== -1) {
                    const splitIndex = matched.indexOf("](");
                    const link = createElement("a");
                    link.href = matched.slice(splitIndex + 2, -1);
                    link.textContent = matched.slice(1, splitIndex);
                    fragment.appendChild(link);
                } else if (matched.startsWith("[email")) {
                    const key = matched.length > 7 ? matched.slice(7, -1) : "default";
                    const encoded = emailsMap[key] || "";
                    if (!encoded) {
                        fragment.appendChild(document.createTextNode(matched));
                    } else {
                        fragment.appendChild(createEmailReveal(encoded, false));
                    }
                } else {
                    const link = createElement("a");
                    link.href = matched;
                    link.textContent = matched;
                    fragment.appendChild(link);
                }
                lastIndex = match.index + matched.length;
            }
            if (lastIndex < text.length) {
                fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
            }
            return fragment;
        }

        function createElement(tag, className, text) {
            const element = document.createElement(tag);
            if (className) {
                element.className = className;
            }
            if (text) {
                element.textContent = text;
            }
            if (tag.toLowerCase() === "a") {
                element.target = "_blank";
                element.rel = "noopener noreferrer";
            }
            return element;
        }

        function slugify(value) {
            return String(value || "")
                .toLowerCase()
                .replace(/&/g, " and ")
                .replace(/[^a-z0-9]+/g, "-")
