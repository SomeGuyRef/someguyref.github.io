<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offer Links</title>
    <style>
        :root {
            --bg-1: #f8f4ec;
            --bg-2: #e8efe1;
            --ink: #182026;
            --muted: #4b5a66;
            --card: #ffffffcc;
            --line: #cfd8cd;
            --accent: #0b6e4f;
            --accent-2: #126782;
            --easy: #1f7a1f;
            --moderate: #8a5a00;
            --shadow: 0 10px 30px rgba(24, 32, 38, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 8%, #fff6dd 0%, transparent 30%),
                radial-gradient(circle at 90% 15%, #d8f0ff 0%, transparent 30%),
                linear-gradient(150deg, var(--bg-1), var(--bg-2));
            font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
            line-height: 1.45;
        }

        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 16px 40px;
        }

        .hero {
            padding: 0;
            margin-bottom: 14px;
            animation: rise-in 400ms ease-out;
        }

        .hero-image-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 0;
        }

        .hero-image {
            width: min(280px, 72vw);
            height: auto;
            border-radius: 16px;
            border: 15px solid #ffffff;
            display: block;
        }

        .section {
            margin-top: 24px;
            animation: rise-in 420ms ease-out;
        }

        .section h2 {
            margin: 0 0 12px;
            font-size: clamp(1.35rem, 3.7vw, 1.8rem);
            border-bottom: 3px solid #a8c7b5;
            padding-bottom: 6px;
        }

        .site-grid {
            display: grid;
            gap: 12px;
        }

        .site {
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 14px;
        }

        .site-title {
            margin: 0 0 10px;
            font-size: 1.24rem;
            font-weight: 800;
            color: #0f4f65;
            background: #e7f2f8;
            border: 1px solid #c6dde8;
            border-left: 6px solid #126782;
            border-radius: 8px;
            padding: 8px 10px;
        }

        .site-title a {
            color: inherit;
        }

        .portal-offers {
            margin-left: 12px;
            padding-left: 12px;
        }

        .offers {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 10px;
        }

        .offer {
            border-top: 1px dashed #d9e1d7;
            padding-top: 10px;
        }

        .offer:first-child {
            border-top: none;
            padding-top: 0;
        }

        .offer-topline {
            font-size: 1rem;
        }

        .amount {
            font-weight: 800;
            color: var(--accent);
            margin-right: 6px;
        }

        .name {
            font-weight: 700;
        }

        .requirement {
            margin-top: 2px;
            color: var(--muted);
            font-size: 0.96rem;
        }

        .description {
            color: var(--muted);
            font-size: 0.92rem;
            font-style: italic;
        }

        .instructions-list {
            margin: 4px 0 0;
            padding-left: 20px;
            color: var(--muted);
            font-size: 0.96rem;
        }

        .instructions-sublist {
            margin: 4px 0 4px;
            padding-left: 18px;
            list-style: disc;
        }

        details.offer-block {
            margin-top: 6px;
            border: 1px solid #ecd7a8;
            border-radius: 8px;
            background: #fdf7e8;
            padding: 6px 10px;
        }

        details.offer-block>summary {
            cursor: pointer;
            font-weight: 700;
            color: #8a5a00;
        }

        details.offer-block[open]>summary {
            margin-bottom: 4px;
        }

        .links {
            margin-top: 6px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .links-label {
            font-size: 0.87rem;
            font-weight: 700;
            color: var(--muted);
            margin-right: 2px;
        }

        .chip {
            display: inline-block;
            border: 1px solid #b6d2c3;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.87rem;
            text-decoration: none;
            color: #154f3a;
            background: #f3fbf6;
        }

        .tag {
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            vertical-align: middle;
        }

        .tag.easy {
            background: #e8f8e8;
            color: var(--easy);
            border: 1px solid #bde6bd;
        }

        .tag.moderate {
            background: #fff6e5;
            color: var(--moderate);
            border: 1px solid #efd7a4;
        }

        .note {
            margin: 6px 0 0;
            font-size: 0.9rem;
            color: var(--muted);
            font-style: italic;
        }

        .reveal-email {
            background: none;
            border: 1px dashed #0a4d72;
            border-radius: 4px;
            padding: 1px 6px;
            color: #0a4d72;
            cursor: pointer;
            font-size: inherit;
            font-family: inherit;
            font-style: inherit;
        }

        .reveal-email:hover {
            background: #e8f0f5;
        }

        .message {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            background: #fff;
            color: var(--muted);
        }

        a {
            color: #0a4d72;
        }

        a:hover {
            color: #07364f;
        }

        @keyframes rise-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 620px) {
            .site {
                padding: 12px;
            }

            .portal-offers {
                margin-left: 8px;
                padding-left: 8px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="hero">
            <div class="hero-image-wrap" id="hero-image-wrap">
                <img class="hero-image" src="snufking.jpg" alt="Snufking"
                    onerror="document.getElementById('hero-image-wrap').style.display='none'">
            </div>
        </section>
        <div id="content" class="message">Loading offers...</div>
    </main>

    <script>
        // JSON shape: { emails?, sections: [ { title, sites: [ { name?, url?, note?, offers?[] } ] } ] }
        // Offer collapsibles use a "blocks" array; each block picks a "preset" (label + colors) and may override label/color.
        let emailsMap = {};

        // Named block presets: label and colors defined once, referenced by "preset".
        const BLOCK_PRESETS = {
            instructions: {
                label: "Instructions",
                textColor: "#154f3a",
                bgColor: "#f5faf7",
                borderColor: "#cfe0d6",
                ordered: true
            },
            instructions2: {
                label: "Instructions",
                textColor: "#126782",
                bgColor: "#eef7fb",
                borderColor: "#c6dde8",
                ordered: true
            },
            notes: {
                label: "Important Notes",
                textColor: "#8a5a00",
                bgColor: "#fdf7e8",
                borderColor: "#ecd7a8",
                ordered: false
            }
        };

        function getEmbeddedData() {
            const node = document.getElementById("offers-data");
            if (!node) {
                return null;
            }
            try {
                return JSON.parse(node.textContent);
            } catch (error) {
                return null;
            }
        }

        function linkifyText(text) {
            const fragment = document.createDocumentFragment();
            const pattern = /(\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^\s)]+\)|https?:\/\/[^\s]+|\[email(?::[\w-]+)?\])/g;
            let lastIndex = 0;
            let match;
            while ((match = pattern.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
                }
                const matched = match[0];
                if (matched.startsWith("**")) {
                    const strong = createElement("strong");
                    strong.textContent = matched.slice(2, -2);
                    fragment.appendChild(strong);
                } else if (matched.startsWith("[") && matched.indexOf("](") !== -1) {
                    const splitIndex = matched.indexOf("](");
                    const link = createElement("a");
                    link.href = matched.slice(splitIndex + 2, -1);
                    link.textContent = matched.slice(1, splitIndex);
                    fragment.appendChild(link);
                } else if (matched.startsWith("[email")) {
                    const key = matched.length > 7 ? matched.slice(7, -1) : "default";
                    const encoded = emailsMap[key] || "";
                    if (!encoded) {
                        fragment.appendChild(document.createTextNode(matched));
                    } else {
                        const button = document.createElement("button");
                        button.className = "reveal-email";
                        button.textContent = "show email";
                        button.addEventListener("click", function () {
                            const email = atob(encoded);
                            const link = createElement("a");
                            link.href = "mailto:" + email;
                            link.textContent = email;
                            button.parentNode.replaceChild(link, button);
                        });
                        fragment.appendChild(button);
                    }
                } else {
                    const link = createElement("a");
                    link.href = matched;
                    link.textContent = matched;
                    fragment.appendChild(link);
                }
                lastIndex = match.index + matched.length;
            }
            if (lastIndex < text.length) {
                fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
            }
            return fragment;
        }

        function createElement(tag, className, text) {
            const element = document.createElement(tag);
            if (className) {
                element.className = className;
            }
            if (text) {
                element.textContent = text;
            }
            if (tag.toLowerCase() === "a") {
                element.target = "_blank";
                element.rel = "noopener noreferrer";
            }
            return element;
        }

        function createLinkedSiteTitle(site) {
            if (!site.name) {
                return null;
            }

            const title = createElement("h3", "site-title");
            if (site.url) {
                const link = createElement("a", null, site.name);
                link.href = site.url;
                title.appendChild(link);
            } else {
                title.textContent = site.name;
            }
            return title;
        }

        function buildBlockList(items, ordered) {
            const list = createElement(ordered ? "ol" : "ul", ordered ? "instructions-list" : null);
            if (!ordered) {
                list.style.margin = "2px 0 0";
                list.style.paddingLeft = "20px";
            }
            items.forEach(function (entry) {
                const li = createElement("li");
                if (entry && typeof entry === "object") {
                    li.appendChild(linkifyText(entry.text || ""));
                    const substeps = Array.isArray(entry.substeps) ? entry.substeps : [];
                    if (substeps.length > 0) {
                        const sub = createElement("ul", "instructions-sublist");
                        substeps.forEach(function (subEntry) {
                            const subLi = createElement("li");
                            subLi.appendChild(linkifyText(subEntry));
                            sub.appendChild(subLi);
                        });
                        li.appendChild(sub);
                    }
                } else {
                    li.appendChild(linkifyText(entry));
                }
                list.appendChild(li);
            });
            return list;
        }

        function resolveBlock(block) {
            const preset = (block.preset && BLOCK_PRESETS[block.preset]) ? BLOCK_PRESETS[block.preset] : {};
            const items = Array.isArray(block.items)
                ? block.items
                : (Array.isArray(block.steps) ? block.steps : []);
            return {
                label: block.label || preset.label || "Details",
                textColor: block.color || preset.textColor || "#8a5a00",
                bgColor: block.bgColor || preset.bgColor || "#fdf7e8",
                borderColor: block.borderColor || preset.borderColor || "#ecd7a8",
                ordered: typeof block.ordered === "boolean" ? block.ordered : (preset.ordered === true),
                collapsible: block.collapsible === true,
                items: items
            };
        }

        function createBlock(block) {
            const resolved = resolveBlock(block);
            if (resolved.items.length === 0) {
                return null;
            }
            if (resolved.collapsible) {
                const details = createElement("details", "offer-block");
                details.style.borderColor = resolved.borderColor;
                details.style.background = resolved.bgColor;
                const summary = createElement("summary", null, resolved.label);
                summary.style.color = resolved.textColor;
                details.appendChild(summary);
                details.appendChild(buildBlockList(resolved.items, resolved.ordered));
                return details;
            }
            const wrapper = createElement("div", "requirement");
            const singleText = resolved.items.length === 1 && !(resolved.items[0] && typeof resolved.items[0] === "object");
            if (singleText) {
                const emphasis = createElement("em");
                emphasis.appendChild(document.createTextNode(resolved.label + ": "));
                emphasis.appendChild(linkifyText(resolved.items[0]));
                wrapper.appendChild(emphasis);
            } else {
                wrapper.appendChild(createElement("em", null, resolved.label + ":"));
                wrapper.appendChild(buildBlockList(resolved.items, resolved.ordered));
            }
            return wrapper;
        }

        function collectOfferBlocks(offer) {
            const blocks = [];
            if (Array.isArray(offer.blocks)) {
                offer.blocks.forEach(function (block) {
                    blocks.push(block);
                });
            }
            // Backward compatibility: fold legacy "instructions" and "details" fields into the block system.
            if (offer.instructions) {
                const instructions = offer.instructions;
                const isArray = Array.isArray(instructions);
                blocks.push({
                    preset: "instructions",
                    label: (!isArray && instructions.label) ? instructions.label : undefined,
                    collapsible: !isArray && instructions.collapsible === true,
                    items: isArray ? instructions : (Array.isArray(instructions.steps) ? instructions.steps : [])
                });
            }
            if (offer.details) {
                const detailsData = offer.details;
                const isObject = detailsData && typeof detailsData === "object" && !Array.isArray(detailsData);
                blocks.push({
                    preset: "notes",
                    label: (isObject && detailsData.label) ? detailsData.label : "Details",
                    collapsible: isObject && detailsData.collapsible === true,
                    items: Array.isArray(detailsData)
                        ? detailsData
                        : (isObject ? (Array.isArray(detailsData.items) ? detailsData.items : []) : [detailsData])
                });
            }
            return blocks;
        }

        function createOfferItem(offer) {
            const item = createElement("li", "offer");
            const topLine = createElement("div", "offer-topline");

            const amount = createElement("span", "amount", offer.amount || "");
            const name = createElement("span", "name", offer.name || "");

            if (offer.url) {
                const link = createElement("a");
                link.href = offer.url;
                link.appendChild(amount);
                link.appendChild(name);
                topLine.appendChild(link);
            } else {
                topLine.appendChild(amount);
                topLine.appendChild(name);
            }

            if (offer.description) {
                const description = createElement("span", "description");
                description.appendChild(document.createTextNode(" - "));
                description.appendChild(linkifyText(offer.description));
                topLine.appendChild(description);
            }

            if (offer.tag) {
                const normalized = offer.tag.toLowerCase();
                const cssClass = normalized === "easy" ? "easy" : normalized === "moderate" ? "moderate" : "";
                const tag = createElement("span", "tag " + cssClass, offer.tag);
                topLine.appendChild(tag);
            }

            item.appendChild(topLine);

            const requirements = Array.isArray(offer.requirements) ? offer.requirements : (offer.requirements ? [offer.requirements] : []);

            if (requirements.length > 0) {
                const requirementsEl = createElement("div", "requirement");
                if (requirements.length === 1) {
                    const emphasis = createElement("em");
                    emphasis.appendChild(document.createTextNode("Requirement: "));
                    emphasis.appendChild(linkifyText(requirements[0]));
                    requirementsEl.appendChild(emphasis);
                } else {
                    const label = createElement("em", null, "Requirements:");
                    requirementsEl.appendChild(label);
                    const list = createElement("ul", null);
                    list.style.margin = "2px 0 0";
                    list.style.paddingLeft = "20px";
                    requirements.forEach(function (entry) {
                        const li = createElement("li");
                        li.appendChild(linkifyText(entry));
                        list.appendChild(li);
                    });
                    requirementsEl.appendChild(list);
                }
                item.appendChild(requirementsEl);
            }

            collectOfferBlocks(offer).forEach(function (block) {
                const blockEl = createBlock(block);
                if (blockEl) {
                    item.appendChild(blockEl);
                }
            });

            if (offer.terms) {
                const terms = createElement("div", "requirement");
                const emphasis = createElement("em");
                emphasis.appendChild(document.createTextNode("Official Terms: "));
                const link = createElement("a", null, offer.terms);
                link.href = offer.terms;
                emphasis.appendChild(link);
                terms.appendChild(emphasis);
                item.appendChild(terms);
            }

            if (offer.links && offer.links.length > 0) {
                const links = createElement("div", "links");
                links.appendChild(createElement("span", "links-label", "Links:"));
                offer.links.forEach(function (platformLink) {
                    const link = createElement("a", "chip", platformLink.label);
                    link.href = platformLink.url;
                    links.appendChild(link);
                });
                item.appendChild(links);
            }

            return item;
        }

        function createSiteCard(site) {
            const card = createElement("article", "site");
            const isPortalWithOffers = Boolean(site.name && site.offers && site.offers.length > 0);

            if (isPortalWithOffers) {
                card.classList.add("site-portal");
            }

            const title = createLinkedSiteTitle(site);
            if (title) {
                card.appendChild(title);
            }

            if (site.note) {
                card.appendChild(createElement("p", "note", site.note));
            }

            if (site.offers && site.offers.length > 0) {
                const offersClass = isPortalWithOffers ? "offers portal-offers" : "offers";
                const offers = createElement("ul", offersClass);
                site.offers.forEach(function (offer) {
                    offers.appendChild(createOfferItem(offer));
                });
                card.appendChild(offers);
            }

            return card;
        }

        function createSection(section, index) {
            const wrapper = createElement("section", "section");
            const titleId = "section-title-" + index;
            wrapper.setAttribute("aria-labelledby", titleId);

            const heading = createElement("h2", null, section.title || "");
            heading.id = titleId;
            wrapper.appendChild(heading);

            const grid = createElement("div", "site-grid");
            (section.sites || []).forEach(function (site) {
                grid.appendChild(createSiteCard(site));
            });
            wrapper.appendChild(grid);

            return wrapper;
        }

        function renderPage(data) {
            emailsMap = data.emails || {};
            const content = document.getElementById("content");

            content.remove();
            const container = document.querySelector("main.page");
            const replacement = document.createDocumentFragment();
            (data.sections || []).forEach(function (section, index) {
                replacement.appendChild(createSection(section, index));
            });
            container.appendChild(replacement);
        }

        function showError(message) {
            const content = document.getElementById("content");
            content.textContent = message;
        }

        document.addEventListener("DOMContentLoaded", function () {
            const embeddedData = getEmbeddedData();
            if (embeddedData) {
                renderPage(embeddedData);
            } else {
                showError("Unable to load embedded offer data JSON.");
            }
        });
    </script>
